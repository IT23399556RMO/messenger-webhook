<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Channel Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- 1st Column: Platforms Sidebar -->
    <div class="sidebar platform-sidebar">
        <h2>Platforms</h2>
        <div class="platform-tabs">
            <div class="nav-tab active" onclick="setPlatformFilter('All')" id="all">All Channels</div>
            <div class="nav-tab" onclick="setPlatformFilter('Facebook')" id="fb">Facebook</div>
            <div class="nav-tab" onclick="setPlatformFilter('Instagram')" id="ig">Instagram</div>
            <div class="nav-tab" onclick="setPlatformFilter('WhatsApp')" id="wa">WhatsApp</div>
            <div class="nav-tab" onclick="setPlatformFilter('Viber')" id="vi">Viber</div>
        </div>
    </div>

    <!-- 2nd Column: Recent Chats List -->
    <div class="sidebar user-sidebar">
        <h2 id="feed-title">Recent Chats</h2>
        <div id="user-list" class="user-list">
            <!-- User cards will inject here -->
        </div>
    </div>

    <!-- 3rd Column: Chat History Main Feed -->
    <div class="main-content">
        <div class="header" id="chat-header">Select a chat to view history</div>
        <div id="logs">
            <div style="color:#888; text-align:center; margin-top:50px;">Waiting for selection...</div>
        </div>
        <button class="clear-btn" onclick="clearLogs()">Clear All Server Logs</button>
    </div>

    <!-- Load separate JS file -->
    <script src="script.js"></script>
</body>
</html>
