<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Channel Messaging Hub</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="sidebar">
        <h2>Dashboard</h2>
        <div class="nav-tab active" id="all" onclick="setFilter('All')">All Channels</div>
        <div class="nav-tab" id="fb" onclick="setFilter('Facebook')">Facebook</div>
        <div class="nav-tab" id="ig" onclick="setFilter('Instagram')">Instagram</div>        
        <div class="nav-tab" id="wa" onclick="setFilter('WhatsApp')">WhatsApp</div>
        <div class="nav-tab" id="vi" onclick="setFilter('Viber')">Viber</div>
        <button class="clear-btn" onclick="clearLogs()">🗑️ Clear Logs</button>
    </div>
    
    <div class="main-content">
        <div class="header" id="feed-title">Live Traffic: All Channels</div>
        <div id="logs">Waiting for traffic...</div>
    </div>

    <script>
        let currentFilter = 'All';

        function setFilter(platform) {
            currentFilter = platform;
            document.getElementById('feed-title').innerText = `Live Traffic: ${platform}`;
            
            // Update active tab styling
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
                if(tab.innerText.includes(platform)) tab.classList.add('active');
            });
            
            fetchLogs(); // Instantly update view when clicking
        }

        async function fetchLogs() {
            try {
                const response = await fetch('/api/logs');
                const data = await response.json();
                
                // Reverse data so newest is at the bottom (like a real chat app)
                const displayData = data.reverse().filter(log => currentFilter === 'All' || log.platform === currentFilter);
                
                if (displayData.length > 0) {
                    document.getElementById('logs').innerHTML = displayData.map(log => `
                        <div class="chat-row ${log.type}" data-platform="${log.platform}">
                            <div class="bubble">${log.message}</div>
                            <div class="meta-data">
                                <span class="platform-tag">${log.platform}</span>
                                <span>${log.time}</span>
                                <span>${log.type.toUpperCase()}</span>
                            </div>
                        </div>
                    `).join('');
                    
                    // Auto-scroll to bottom
                    const mainContent = document.querySelector('.main-content');
                    mainContent.scrollTop = mainContent.scrollHeight;
                } else {
                    document.getElementById('logs').innerHTML = '<div style="color:#888;">No messages yet for this channel.</div>';
                }
            } catch (e) {}
        }

        async function clearLogs() {
            await fetch('/api/logs/clear', { method: 'POST' });
            fetchLogs(); // Instantly refreshes the screen
        }

        // Fetch every 2 seconds
        setInterval(fetchLogs, 2000);
        fetchLogs();
    </script>
</body>
</html>
